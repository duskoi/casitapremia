<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#16342d">
  <title>Casita Premià · Guía de bienvenida</title>
  <style>
    :root{--ink:#17352e;--cream:#f5f0e6;--paper:#fffdf8;--accent:#d58c55;--muted:#687770}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}
    .hero{min-height:58vh;display:grid;align-items:end;padding:clamp(28px,6vw,72px);position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(17,54,45,.96),rgba(27,72,61,.78)),radial-gradient(circle at 80% 20%,#d9a273 0 10%,transparent 11%),linear-gradient(120deg,#244f42,#102d27)}
    .hero:after{content:"";position:absolute;width:360px;height:360px;border:1px solid rgba(255,255,255,.15);border-radius:50%;right:-80px;top:-100px;box-shadow:0 0 0 60px rgba(255,255,255,.035),0 0 0 120px rgba(255,255,255,.025)}
    .eyebrow{font-size:.77rem;letter-spacing:.2em;text-transform:uppercase;color:#f0c49e;font-weight:700}
    h1{font-family:Georgia,serif;color:white;font-size:clamp(3.2rem,10vw,7rem);line-height:.88;margin:.18em 0;max-width:820px;font-weight:500}
    .intro{color:#e9f0ed;max-width:520px;font-size:clamp(1rem,2vw,1.2rem);line-height:1.55}
    main{width:min(1080px,calc(100% - 32px));margin:-38px auto 70px;position:relative}
    .card{background:var(--paper);border-radius:28px;box-shadow:0 20px 55px rgba(22,52,45,.13);overflow:hidden}
    .wifi{display:grid;grid-template-columns:1.25fr .75fr;min-height:420px}
    .copy{padding:clamp(30px,6vw,68px)}
    .tag{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#e7efe9;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    h2{font-family:Georgia,serif;font-size:clamp(2.25rem,5vw,4rem);font-weight:500;margin:18px 0 10px}
    .hint{color:var(--muted);line-height:1.6;margin:0 0 28px}
    .credentials{display:grid;gap:12px;margin:24px 0}
    .row{border:1px solid #dfe7e2;border-radius:16px;padding:15px 17px;display:flex;justify-content:space-between;gap:18px;align-items:center}
    .label{display:block;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:800}
    .value{font-size:1.18rem;font-weight:800;overflow-wrap:anywhere}
    button{border:0;background:var(--ink);color:white;border-radius:14px;padding:14px 19px;font:inherit;font-weight:800;cursor:pointer;transition:.2s transform,.2s background}
    button:hover{transform:translateY(-2px);background:#225347}
    .qrpanel{background:#d9a06f;display:grid;place-items:center;padding:35px;text-align:center}
    .qrbox{background:white;padding:18px;border-radius:24px;box-shadow:0 12px 30px rgba(35,31,22,.18);min-width:266px;min-height:266px;display:grid;place-items:center}
    .qrbox img,.qrbox canvas{display:block;max-width:230px;height:auto}
    .scan{margin:16px 0 0;font-weight:800}
    .foot{text-align:center;color:var(--muted);padding:30px 16px 0;font-size:.9rem}
    .modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(10,31,26,.72);backdrop-filter:blur(8px)}
    .modal.open{display:grid}.modal-card{position:relative;width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--paper);border-radius:28px;box-shadow:0 28px 80px rgba(0,0,0,.3)}
    .modal-grid{display:grid;grid-template-columns:1fr .85fr}.modal-copy{padding:clamp(28px,5vw,52px)}.modal-qr{background:#d9a06f;display:grid;place-items:center;padding:32px;text-align:center}
    .close{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.5rem;z-index:2;background:rgba(23,53,46,.92)}
    @media(max-width:720px){.hero{min-height:52vh;padding-bottom:70px}.wifi{grid-template-columns:1fr}.qrpanel{min-height:360px}main{margin-top:-28px}.row{align-items:flex-start;flex-direction:column}.modal-grid{grid-template-columns:1fr}.modal-qr{padding:28px}.modal-card{max-height:calc(100vh - 24px)}}

    .quick{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:28px}
    .quick a{background:var(--paper);color:var(--ink);text-decoration:none;border-radius:22px;padding:22px;display:flex;align-items:center;gap:16px;box-shadow:0 14px 40px rgba(22,52,45,.12);transition:.2s transform,.2s box-shadow}
    .quick a:hover{transform:translateY(-3px);box-shadow:0 18px 48px rgba(22,52,45,.17)}
    .navicon{width:54px;height:54px;border-radius:17px;background:#e7efe9;display:grid;place-items:center;flex:0 0 auto}
    .navicon svg{width:28px;height:28px;stroke:var(--ink)}.quick strong{display:block;font-size:1.05rem}.quick small{color:var(--muted)}
    .arrival{margin-top:28px}.arrival-head{padding:clamp(30px,6vw,68px);background:linear-gradient(130deg,#fffdf8,#f8eadc)}
    .route-summary{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.9rem}
    .route-summary b{color:var(--ink);background:white;border:1px solid #dfe7e2;padding:8px 11px;border-radius:999px}.arrow{color:var(--accent);font-weight:900}
    .steps{padding:0 clamp(24px,5vw,58px) 52px}.step{display:grid;grid-template-columns:58px 1fr;gap:18px;position:relative;padding:0 0 30px}
    .step:not(:last-child):before{content:"";position:absolute;left:28px;top:56px;bottom:4px;width:2px;background:#d9e2dd}
    .num{width:58px;height:58px;border-radius:18px;background:var(--ink);color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:1.35rem;position:relative;z-index:1}
    .step-body{padding:5px 0 0}.step h3{font-family:Georgia,serif;font-size:1.45rem;font-weight:500;margin:0 0 7px}.step p{margin:0;color:var(--muted);line-height:1.55}
    .en{font-size:.9rem;margin-top:6px!important;color:#87928d!important}.notice{margin-top:12px!important;padding:12px 15px;border-radius:13px;background:#f4eadf;color:#76523a!important;font-size:.9rem}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.button{background:var(--ink);color:white;border-radius:14px;padding:14px 19px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:.2s transform,.2s background}
    .button:hover{transform:translateY(-2px);background:#225347}.button.secondary{background:white;color:var(--ink);border:1px solid #dfe7e2}.welcome{padding:30px;text-align:center;background:var(--ink);color:white}.welcome p{margin:7px 0;color:#dbe7e2}
    @media(max-width:720px){.quick a{padding:15px;gap:11px}.quick small{display:none}.navicon{width:46px;height:46px;border-radius:14px}.step{grid-template-columns:48px 1fr;gap:14px}.num{width:48px;height:48px;border-radius:15px}.step:not(:last-child):before{left:23px;top:47px}}
  </style>
</head>
<body>
  <header class="hero">
    <div>
      <div class="eyebrow">Guía de bienvenida</div>
      <h1>Casita<br>Premià</h1>
      <p class="intro">Todo lo esencial para sentirte en casa desde el primer minuto.</p>
    </div>
  </header>
  <main>
    <nav class="quick" aria-label="Accesos rápidos">
      <a href="#" id="open-wifi"><span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M2 9a14.5 14.5 0 0 1 20 0"/></svg></span><span><strong>Wi‑Fi</strong><small>Conectar ahora</small></span></a>
      <a href="airport-how-to-arrive.pdf" target="_blank" rel="noopener"><span class="navicon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span><strong>Cómo llegar</strong><small>Abrir guía en PDF</small></span></a>
    </nav>
    <p class="foot">Casita Premià · Bienvenido/a</p>
  </main>
  <div class="modal" id="wifi-modal" role="dialog" aria-modal="true" aria-labelledby="wifi-title">
    <div class="modal-card">
      <button class="close" id="close-wifi" type="button" aria-label="Cerrar">×</button>
      <div class="modal-grid">
        <div class="modal-copy"><span class="tag">⌁ Wi‑Fi</span><h2 id="wifi-title">Conéctate</h2><p class="hint">Escanea el código QR o introduce estos datos.</p><div class="credentials"><div class="row"><div><span class="label">Red</span><span class="value">MINI</span></div></div><div class="row"><div><span class="label">Contraseña</span><span class="value">4040404040</span></div><button id="copy" type="button">Copiar</button></div></div></div>
        <div class="modal-qr"><div><div class="qrbox" id="qrcode" role="img" aria-label="Código QR para conectarse a la red MINI"></div><p class="scan">Escanea para conectarte</p></div></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById('qrcode'),{text:'WIFI:T:WPA;S:MINI;P:4040404040;;',width:230,height:230,colorDark:'#17352e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
    const button=document.getElementById('copy');
    button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText('4040404040');button.textContent='Copiada ✓'}catch{button.textContent='4040404040'}setTimeout(()=>button.textContent='Copiar',2200)});
    const modal=document.getElementById('wifi-modal');
    const openWifi=document.getElementById('open-wifi');
    const closeWifi=document.getElementById('close-wifi');
    function closeModal(){modal.classList.remove('open');document.body.style.overflow='';openWifi.focus()}
    openWifi.addEventListener('click',event=>{event.preventDefault();modal.classList.add('open');document.body.style.overflow='hidden';closeWifi.focus()});
    closeWifi.addEventListener('click',closeModal);
    modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.classList.contains('open'))closeModal()});
  </script>
</body>
</html>
